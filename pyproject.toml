[project]
name = "superset-s3-export"
version = "0.1.0"
description = "Superset plugin for exporting large datasets to S3 with email notifications"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
    {name = "thewandererbg", email = "thewandererbg@example.com"}
]
keywords = ["superset", "s3", "export", "analytics", "data"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "boto3>=1.28.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.0.285",
    "mypy>=1.5.0",
    "apache-superset>=6.0.0",
]

[project.urls]
Homepage = "https://github.com/thewandererbg/superset-s3-export"
Documentation = "https://github.com/thewandererbg/superset-s3-export#readme"
Repository = "https://github.com/thewandererbg/superset-s3-export"
Issues = "https://github.com/thewandererbg/superset-s3-export/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["superset_s3_export"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
